<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TURAS — Transport, User Routing and Scheduling</title>
<meta name="description" content="TURAS connects people to the right transport, at the right time, with care at the heart of every journey. Full site launching soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-blue: #05387A;
    --teal: #0D7B88;
    --green: #58A244;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Poppins', sans-serif;
    /* Brand gradient: deep blue leading, teal mid, green arriving in the lower corner */
    background: linear-gradient(160deg, var(--deep-blue) 0%, var(--teal) 62%, var(--green) 118%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 3rem 1.5rem;
  }

  /* Journey route motif — dashed path from start dot to end dot, now in white */
  .route {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .route path {
    fill: none;
    stroke: #fff;
    stroke-width: 2.5;
    stroke-dasharray: 2 12;
    stroke-linecap: round;
    opacity: 0.35;
  }

  .route circle { opacity: 0.55; }

  .content {
    position: relative;
    text-align: center;
    max-width: 34rem;
  }

  .logo {
    width: clamp(96px, 22vw, 128px);
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 10px 24px rgba(2, 24, 54, 0.35));
  }

  .wordmark {
    margin-top: 1.8rem;
    font-size: clamp(3.25rem, 11vw, 5.75rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1;
    color: #fff;
  }

  .tagline {
    margin-top: 0.9rem;
    font-size: clamp(0.95rem, 2.6vw, 1.15rem);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
  }

  .concept {
    margin: 2.4rem auto 0;
    font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    font-weight: 400;
    line-height: 1.7;
    max-width: 28rem;
    color: rgba(255, 255, 255, 0.92);
  }

  .launch {
    margin-top: 2.4rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.95rem;
    font-weight: 500;
    color: #fff;
  }

  .launch::before {
    content: "";
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: #fff;
    flex: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .route path {
      stroke-dashoffset: 240;
      animation: travel 2.4s ease-out forwards;
    }
    @keyframes travel {
      to { stroke-dashoffset: 0; }
    }
  }
</style>
</head>
